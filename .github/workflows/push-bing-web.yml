name: Submit URLs to IndexNow (Bing)
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 */10 * *' # 每 10 天在 UTC 时间 00:00 触发
  workflow_dispatch: # 允许手动触发

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet jq

      - name: Extract URLs and submit to IndexNow
        env:
          BING_APIKEY: ${{ secrets.BING_APIKEY }}
        run: |
          article_urls=$(xmlstarlet sel -N x="http://www.sitemaps.org/schemas/sitemap/0.9" -t -m "//x:url/x:loc" -v . -n ./sitemap.xml | grep -E '/[0-9]{4}/[0-9]{2}/[0-9]{2}/' | grep .)
          home_url="https://wu3227834.github.io/"

          if [ -z "$article_urls" ]; then
            echo "No article URLs found in sitemap.xml"
            exit 1
          fi

          all_urls=$(printf "%s\n%s\n" "$home_url" "$article_urls" | sort -u)
          url_list=$(echo "$all_urls" | jq -R . | jq -s .)

          # 使用 secret（注意：如果 key 需要公开放在 /<key>.txt，key 就不能是私密）
          json_payload=$(jq -n \
            --arg host "wu3227834.github.io" \
            --arg key "$BING_APIKEY" \
            --arg keyLocation "https://wu3227834.github.io/$BING_APIKEY.txt" \
            --argjson urlList "$url_list" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          # 不要直接打印包含密钥的 payload，打印时去掉 key 字段或不打印 payload
          echo "Prepared payload (key redacted):"
          echo "$json_payload" | jq 'del(.key)'

          response=$(curl -s -w "\n%{http_code}" -X POST -H "Content-Type: application/json" -d "$json_payload" "https://api.indexnow.org/IndexNow")
          http_code=$(echo "$response" | tail -n1)
          response_body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $response_body"

          if [ "$http_code" = "202" ] || [ "$http_code" = "200" ]; then
            echo "✅ IndexNow submission successful"
          else
            echo "❌ IndexNow submission failed"
            exit 1
          fi