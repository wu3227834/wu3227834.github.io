name: Submit URLs to IndexNow (Bing)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 */10 * *' # 每 10 天 UTC 00:00 触发
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet jq

      - name: Extract latest 10 URLs and submit to IndexNow
        env:
          BING_APIKEY: ${{ secrets.BING_APIKEY }}
        run: |
          set -e

          home_url="https://wu3227834.github.io/"

          # 从 sitemap.xml 中提取文章 URL
          # URL 格式：
          # /YYYY/MM/DD/xxxx/
          article_urls=$(
            xmlstarlet sel \
              -N x="http://www.sitemaps.org/schemas/sitemap/0.9" \
              -t \
              -m "//x:url/x:loc" \
              -v . \
              -n \
              ./sitemap.xml |
            grep -E '/[0-9]{4}/[0-9]{2}/[0-9]{2}/' |
            grep .
          )

          if [ -z "$article_urls" ]; then
            echo "No article URLs found in sitemap.xml"
            exit 1
          fi

          # 按 URL 中的日期倒序排列，取最新 10 篇
          latest_urls=$(
            echo "$article_urls" |
            awk -F/ '
              {
                # URL:
                # https://wu3227834.github.io/YYYY/MM/DD/slug/
                date = $4 $5 $6
                print date "|" $0
              }
            ' |
            sort -r |
            head -n 10 |
            cut -d'|' -f2
          )

          if [ -z "$latest_urls" ]; then
            echo "No latest article URLs found"
            exit 1
          fi

          echo "Latest 10 article URLs:"
          echo "$latest_urls"

          # 首页 + 最新 10 篇文章
          all_urls=$(
            printf "%s\n%s\n" "$home_url" "$latest_urls" |
            sort -u
          )

          echo ""
          echo "URLs to submit:"
          echo "$all_urls"

          # 转换成 JSON 数组
          url_list=$(
            echo "$all_urls" |
            jq -R . |
            jq -s .
          )

          # 构造 IndexNow payload
          json_payload=$(
            jq -n \
              --arg host "wu3227834.github.io" \
              --arg key "$BING_APIKEY" \
              --arg keyLocation "https://wu3227834.github.io/$BING_APIKEY.txt" \
              --argjson urlList "$url_list" \
              '{
                host: $host,
                key: $key,
                keyLocation: $keyLocation,
                urlList: $urlList
              }'
          )

          # 不打印 key
          echo ""
          echo "Prepared payload (key redacted):"
          echo "$json_payload" | jq 'del(.key)'

          # 提交 IndexNow
          response=$(
            curl -s \
              -w "\n%{http_code}" \
              -X POST \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$json_payload" \
              "https://api.indexnow.org/IndexNow"
          )

          http_code=$(echo "$response" | tail -n1)
          response_body=$(echo "$response" | sed '$d')

          echo ""
          echo "HTTP Status: $http_code"
          echo "Response: $response_body"

          if [ "$http_code" = "202" ] || [ "$http_code" = "200" ]; then
            echo "✅ IndexNow submission successful"
          else
            echo "❌ IndexNow submission failed"
            exit 1
          fi
